name: Refresh federal campgrounds

# Recreation.gov publishes its full RIDB export daily; pull it monthly and rebuild the site.
on:
  schedule:
    - cron: '17 9 3 * *'   # 09:17 UTC on the 3rd of every month
  workflow_dispatch:

permissions:
  contents: write

# Both refresh workflows commit generated files, so they queue behind each other instead of racing.
concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Download RIDB export
        run: |
          mkdir -p /tmp/ridb
          curl -sSfL -o /tmp/ridb/ridb.zip https://ridb.recreation.gov/downloads/RIDBFullExport_V1_CSV.zip
          unzip -q -o /tmp/ridb/ridb.zip -d /tmp/ridb
      - name: Rebuild
        run: |
          python3 federal/build_ridb.py /tmp/ridb
          python3 build_site.py
      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add federal/federal-combos.csv federal/federal-times.csv federal-rv-summary.csv index.html README.md
          git diff --cached --quiet && { echo "No changes"; exit 0; }
          git commit -m "Refresh federal campgrounds from Recreation.gov ($(date -u +%Y-%m-%d))"
          git pull --rebase -X theirs origin main || { git rebase --abort; exit 1; }
          git push
